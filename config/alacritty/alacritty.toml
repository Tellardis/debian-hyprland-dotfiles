[window]
padding = { x = 15, y = 15 }
dynamic_padding = true
opacity = 0.93
blur = true

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono" # Использует ваш системный терминальный шрифт
style = "Regular"

[cursor]
style = { shape = "Beam", blinking = "On" } # Курсор в виде вертикальной черты (|)

[scrolling]
history = 10000

# Встроенная цветовая схема One Dark (не требует скачивания файлов)
[colors.primary]
background = '#282c34'
foreground = '#abb2bf'

[colors.normal]
black =   '#1e2127'
red =     '#e06c75'
green =   '#98c379'
yellow =  '#d19a66'
blue =    '#61afef'
magenta = '#c678dd'
cyan =    '#56b6c2'
white =   '#abb2bf'


# Копирование/вставка и на русской раскладке (logical key = кириллица)
[[keyboard.bindings]]
key = "с"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "м"
mods = "Control|Shift"
action = "Paste"
